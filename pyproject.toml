[project]
name = "claude-code-proxy"
version = "0.1.0"
description = "A lightweight, modular Proxy Server (Gateway) for Claude Code CLI and VSCode"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.6.4",
    "typer>=0.9.0",
    "pyTelegramBotAPI>=4.16.0",
    "python-telegram-bot>=20.0",
    "discord.py>=2.3.2",
    "tiktoken>=0.7.0",
    "pyyaml>=6.0.2",
    "loguru>=0.7.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = "."

